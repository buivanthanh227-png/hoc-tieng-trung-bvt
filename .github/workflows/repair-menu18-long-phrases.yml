name: One-time Menu 18 long Pinyin repair
on:
  push:
    paths:
      - ".github/workflows/repair-menu18-long-phrases.yml"
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Repair Menu 18 candidate generation and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  " {zh:'我不知道',py:'wǒ bù zhī dào',vi:'Tôi không biết.'}\n];",
                  " {zh:'我不知道',py:'wǒ bù zhī dào',vi:'Tôi không biết.'},\n {zh:'今天我家有客人',py:'jīntiān wǒ jiā yǒu kèrén',vi:'Hôm nay nhà tôi có khách.'}\n];"
              ),
              (
                  "  if([...String(row[0]||'')].length===1&&!key.includes(' ')&&key.length<=6)syllables.add(key);\n });\n pinyin18IndexSource=rows;pinyin18Lexicon=index;pinyin18Syllables=syllables;",
                  "  if([...String(row[0]||'')].length===1&&!key.includes(' ')&&key.length<=6)syllables.add(key);\n });\n // Ensure common one-character syllables remain usable even when the main dictionary omits them.\n for(const [py,zh] of Object.entries(PINYIN18_COMMON_CHARACTERS)){\n  if([...String(zh||'')].length!==1||py.length>6)continue;\n  syllables.add(py);\n  if(!index.has(py))index.set(py,[{row:[zh,zh,py,''],rowIndex:rows.length+syllables.size}]);\n }\n pinyin18IndexSource=rows;pinyin18Lexicon=index;pinyin18Syllables=syllables;"
              ),
              (
                  "    if(syllables.length>2&&!state.rows.some(row=>[...String(row[0]||'')].length>1))continue;\n",
                  ""
              )
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one source match, got {count}: {old[:90]}")
              source = source.replace(old, new)

          required = ["今天我家有客人", "Ensure common one-character syllables", "pinyin18Syllables=syllables"]
          if not all(item in source for item in required):
              raise SystemExit("Menu 18 patch assertions failed")
          path.write_text(source, encoding="utf-8", newline="")

          sw = Path("sw.js")
          sw_source = sw.read_text(encoding="utf-8")
          old_cache = "hoc-trung-app-shell-v42-9-6-menu18-pinyin-fix-20261121"
          new_cache = "hoc-trung-app-shell-v42-9-7-menu18-long-pinyin-20261122"
          if sw_source.count(old_cache) != 1:
              raise SystemExit("Expected current service-worker cache key exactly once")
          sw.write_text(sw_source.replace(old_cache, new_cache), encoding="utf-8", newline="")

          blocks = re.findall(r'<script([^>]*)>(.*?)</script>', source, re.S | re.I)
          checked = 0
          with tempfile.TemporaryDirectory() as tmp:
              for attrs, code in blocks:
                  if 'src=' in attrs or 'type="text/plain"' in attrs:
                      continue
                  file = Path(tmp) / f"inline-{checked}.js"
                  file.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(file)], check=True)
                  checked += 1
          if checked < 1:
              raise SystemExit("No inline scripts were syntax-checked")
          Path(".github/workflows/repair-menu18-long-phrases.yml").unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(menu18): support long Pinyin phrases and character fallback"
          git push origin HEAD:main
