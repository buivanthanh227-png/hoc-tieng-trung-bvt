name: Menu 3 semantic composition regression

on:
  pull_request:
    branches: [main]
    paths:
      - "menu3-pinyin-fix-v42.10.23.js"
      - "qa-tests/menu3-meaning-and-modal.test.cjs"
      - "qa-tests/menu3-runtime-quality.test.cjs"
      - "qa-tests/menu3-pinyin-hotfix.test.cjs"
      - "index.html"
      - ".github/workflows/menu3-semantic-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu3-semantic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Menu 3 runtime syntax
        run: node --check menu3-pinyin-fix-v42.10.23.js
      - name: Run Menu 3 semantic and modal regressions
        run: node --test qa-tests/menu3-meaning-and-modal.test.cjs qa-tests/menu3-runtime-quality.test.cjs qa-tests/menu3-pinyin-hotfix.test.cjs
