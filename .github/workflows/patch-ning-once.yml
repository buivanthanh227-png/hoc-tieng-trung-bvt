name: One-time patch Pinyin ning cell

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-ning-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Add ning at n + ing intersection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          before = '["na","","ne","","","nai","nei","nao","nou","nan","nen","nang","neng","nong","ni","","niao","nie","niu","nian","nin","niang","","","nu","","nuo","","","nuan","","","nü","nüe","",""]'
          after  = '["na","","ne","","","nai","nei","nao","nou","nan","nen","nang","neng","nong","ni","","niao","nie","niu","nian","nin","niang","ning","","nu","","nuo","","","nuan","","","nü","nüe","",""]'

          count = source.count(before)
          if count != 1:
              raise SystemExit(f"Expected exactly one n-row to patch; found {count}. No changes made.")

          updated = source.replace(before, after, 1)
          if updated.count(after) != 1:
              raise SystemExit("Post-patch verification failed.")

          # Confirm the new cell is column 22 (ing) in the 36-column chart.
          import json
          row = json.loads(after)
          if len(row) != 36 or row[22] != "ning":
              raise SystemExit("ning is not at the expected n + ing intersection.")

          path.write_text(updated, encoding="utf-8")
          print("Verified: n + ing cell now contains ning.")
          PY

      - name: Commit index.html and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-ning-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-ning-once.yml
          git commit -m "Add ning syllable to Pinyin listening chart"
          git push origin HEAD:main

      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/buivanthanh227-png/hoc-tieng-trung-bvt/actions/workflows/deploy-pages.yml/dispatches -f ref=main
