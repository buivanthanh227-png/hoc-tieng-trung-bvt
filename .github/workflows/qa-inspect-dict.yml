name: Verify V42.9.4 QA fixes
on:
  push:
    branches: ["fix/v42.9.4-qa"]
    paths:
      - ".github/workflows/qa-inspect-dict.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v42.9.4-qa
      - name: Verify dictionary ranking behavior with actual patched function
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/function searchScoreForRow\(i,q\)\{[\s\S]*?\n\}/);
          if (!match) throw new Error('searchScoreForRow not found');
          const searchIndex = [
            {simp:'鱼', trad:'魚', py:'yu', meaning:'ca'},
            {simp:'擦', trad:'擦', py:'ca', meaning:'wipe'},
            {simp:'你', trad:'你', py:'ni', meaning:'you'}
          ];
          const SEARCH_SYNONYMS = {};
          const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'').trim();
          const score = new Function('searchIndex','SEARCH_SYNONYMS','norm', match[0]+'; return searchScoreForRow;')(searchIndex,SEARCH_SYNONYMS,norm);
          const meaningScore = score(0,'ca');
          const pinyinScore = score(1,'ca');
          const pinyinStillSearchable = score(2,'ni');
          console.log({meaningScore,pinyinScore,pinyinStillSearchable});
          if (!(meaningScore > pinyinScore)) throw new Error('Vietnamese meaning does not outrank Pinyin for short query');
          if (!(pinyinStillSearchable > 0)) throw new Error('Short Pinyin lookup was removed instead of demoted');
          console.log('PASS: meaning match ranks above short Pinyin match; Pinyin remains searchable.');
          JS
      - name: Verify PWA deployment package and cache version
        shell: bash
        run: |
          set -euo pipefail
          for icon in icon-v41-192.png icon-v41-512.png apple-touch-icon-v41.png; do
            test -s "$icon"
            grep -Fq 'cp "$icon" site/' .github/workflows/deploy-pages.yml
          done
          grep -Fq "hoc-trung-app-shell-v42-9-4-pwa-icons-20261118" sw.js
          grep -Fq "Thiếu PWA icon bắt buộc" .github/workflows/deploy-pages.yml
          echo "PASS: all three PNG icons are present and included in Pages deployment; cache key bumped once."
