name: Inspect dictionary ranking for V42.9.4
on:
  push:
    branches: ["fix/v42.9.4-qa"]
    paths:
      - ".github/workflows/qa-inspect-dict.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant source without modifying it
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          print("INDEX_BYTES", len(s.encode("utf-8")))
          for term in ["searchScoreForRow", "dict-search", "function search"]:
              print("\\n=== TERM", term, "===")
              hits=[m.start() for m in re.finditer(re.escape(term),s)]
              print("HITS",len(hits))
              for pos in hits[:8]:
                  print(s[max(0,pos-1600):min(len(s),pos+2600)])
          for name in ["icon-v41-192.png","icon-v41-512.png","apple-touch-icon-v41.png"]:
              p=Path(name)
              print("ICON",name,"EXISTS",p.is_file(),"BYTES",p.stat().st_size if p.is_file() else 0)
          print("MANIFEST",Path("manifest.webmanifest").read_text(encoding="utf-8"))
          PY
