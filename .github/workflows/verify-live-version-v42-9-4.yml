name: Verify deployed V42.9.4 website

on:
  push:
    branches:
      - qa/verify-live-version-v42-9-4

permissions:
  contents: write

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify live website version and PWA assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://buivanthanh227-png.github.io/hoc-tieng-trung-bvt"
          CACHE_BUSTER="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          fetch_page() {
            local url="$1"
            local output="$2"
            local code
            code=$(curl --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 --max-time 60 \
              -H 'Cache-Control: no-cache' \
              -o "$output" -w '%{http_code}' "$url")
            echo "$url -> HTTP $code"
            test "$code" = "200"
          }

          fetch_page "$BASE/index.html?v=$CACHE_BUSTER" live-index.html
          fetch_page "$BASE/manifest.webmanifest?v=$CACHE_BUSTER" live-manifest.webmanifest

          grep -Fq '<title>HỌC TIẾNG TRUNG · V42.9.4</title>' live-index.html
          ! grep -Fq 'V42.9.3' live-index.html
          grep -Fq '"name": "HỌC TIẾNG TRUNG BVT · V42.9.4"' live-manifest.webmanifest
          ! grep -Fq 'V42.9.3' live-manifest.webmanifest
          echo "PASS: live HTML title and PWA manifest both report V42.9.4"

          for asset in icon-v41-192.png icon-v41-512.png apple-touch-icon-v41.png; do
            code=$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 \
              -o /dev/null -w '%{http_code}' "$BASE/$asset?v=$CACHE_BUSTER")
            echo "$asset -> HTTP $code"
            test "$code" = "200"
          done
          echo "PASS: all PWA icon endpoints return HTTP 200"

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-live-version-v42-9-4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/verify-live-version-v42-9-4.yml
          git commit -m "chore(qa): remove temporary live version check"
          git push origin HEAD:qa/verify-live-version-v42-9-4
