name: Menu 18 independent mapping validation

on:
  push:
    branches:
      - main
      - fix/menu18-independent-token-mapping-v42-9-9
    paths:
      - 'index.html'
      - 'tools/patch_menu18_ranking.py'
      - 'tools/patch_menu18_word_mapping.py'
      - 'tools/patch_menu18_multicandidate.py'
      - 'tools/patch_menu18_independent_mapping.py'
      - 'tools/test_menu18_independent_mapping.py'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/menu18-patch-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/patch_menu18_ranking.py'
      - 'tools/patch_menu18_word_mapping.py'
      - 'tools/patch_menu18_multicandidate.py'
      - 'tools/patch_menu18_independent_mapping.py'
      - 'tools/test_menu18_independent_mapping.py'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/menu18-patch-validation.yml'

permissions:
  contents: read

jobs:
  validate-menu18-independent-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply all Menu 18 overlays and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/menu18-check
          cp index.html /tmp/menu18-check/index.html
          python3 -m py_compile tools/patch_menu18_ranking.py tools/patch_menu18_word_mapping.py tools/patch_menu18_multicandidate.py tools/patch_menu18_independent_mapping.py tools/test_menu18_independent_mapping.py
          python3 tools/patch_menu18_ranking.py /tmp/menu18-check/index.html
          python3 tools/patch_menu18_word_mapping.py /tmp/menu18-check/index.html
          python3 tools/patch_menu18_multicandidate.py /tmp/menu18-check/index.html
          python3 tools/patch_menu18_independent_mapping.py /tmp/menu18-check/index.html
          python3 tools/patch_menu18_independent_mapping.py /tmp/menu18-check/index.html
          python3 tools/test_menu18_independent_mapping.py /tmp/menu18-check/index.html
