name: Menu 3 independent mapping validation

on:
  push:
    branches: [main, fix/menu18-whole-sentence-verified-v42-10-1]
    paths:
      - 'index.html'
      - 'tools/patch_menu18_ranking.py'
      - 'tools/patch_menu18_word_mapping.py'
      - 'tools/patch_menu18_multicandidate.py'
      - 'tools/test_menu18_word_mapping.py'
      - 'tools/patch_menu3_clone.py'
      - 'tools/test_menu3_clone.py'
      - 'tools/patch_menu3_ui_fix.py'
      - 'tools/test_menu3_ui_fix.py'
      - 'tools/patch_brand_header.py'
      - 'tools/test_brand_header.py'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/menu18-patch-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/patch_menu18_ranking.py'
      - 'tools/patch_menu18_word_mapping.py'
      - 'tools/patch_menu18_multicandidate.py'
      - 'tools/test_menu18_word_mapping.py'
      - 'tools/patch_menu3_clone.py'
      - 'tools/test_menu3_clone.py'
      - 'tools/patch_menu3_ui_fix.py'
      - 'tools/test_menu3_ui_fix.py'
      - 'tools/patch_brand_header.py'
      - 'tools/test_brand_header.py'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/menu18-patch-validation.yml'

permissions:
  contents: read

jobs:
  validate-menu3-independent-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source Menu 3 and retired Menu 18 state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_menu18_ranking.py tools/patch_menu18_word_mapping.py tools/patch_menu18_multicandidate.py tools/test_menu18_word_mapping.py tools/patch_menu3_clone.py tools/test_menu3_clone.py tools/patch_menu3_ui_fix.py tools/test_menu3_ui_fix.py tools/patch_brand_header.py tools/test_brand_header.py
          python3 tools/test_menu18_word_mapping.py index.html
          python3 tools/test_menu3_clone.py index.html
          python3 tools/test_menu3_ui_fix.py index.html
          python3 tools/test_brand_header.py index.html
          if grep -q 'data-tab="translate-experimental"\|id="panel-translate-experimental"' index.html; then
            echo "::error::The retired Menu 18 remains in source."
            exit 1
          fi
