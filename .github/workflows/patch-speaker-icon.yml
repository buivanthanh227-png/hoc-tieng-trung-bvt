name: Patch speaker icons in Pinyin chart 16.1
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-speaker-icon.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patch-speaker-icon
  cancel-in-progress: false
jobs:
  patch-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace emoji speakers with SVG icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          source = index.read_text(encoding="utf-8")

          # SVG speaker icon using currentColor so it follows button color
          speaker_svg = '''<svg class="p16-speaker-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>'''

          # Replace the emoji spans
          old_pattern = '<span aria-hidden="true">🔊</span>'
          new_span = f'<span aria-hidden="true">{speaker_svg}</span>'
          count = source.count(old_pattern)
          print(f"Found {count} speaker emoji spans to replace")
          if count == 0:
              print("No emoji found, checking alternative patterns...")
              # maybe already replaced or different
              if 'p16-speaker-icon' in source:
                  print("Already has SVG icons")
              else:
                  raise SystemExit("Không tìm thấy biểu tượng loa 🔊 để thay thế")
          source = source.replace(old_pattern, new_span)

          # Update CSS to remove the invert filter that makes emoji white blob, and ensure SVG is visible
          style_id = "bvt-pinyin-speaker-svg-20261118"
          extra_css = '''
          <style id="bvt-pinyin-speaker-svg-20261118">
          /* Biểu tượng loa SVG rõ ràng, không bị filter thành blob trắng */
          #panel-pinyin-audio .p16-sequence-btn .p16-speaker-icon{vertical-align:middle;display:inline-block}
          #panel-pinyin-audio .p16-sequence-btn span{filter:none!important}
          #panel-pinyin-audio .p16-chart-table thead th.p16-column-action .p16-sequence-btn span,
          #panel-pinyin-audio .p16-chart-table tbody td.p16-row-action-cell .p16-sequence-btn span{filter:none!important}
          </style>
          '''
          if f'id="{style_id}"' not in source:
              if "</head>" in source:
                  source = source.replace("</head>", extra_css + "\n</head>", 1)
              else:
                  raise SystemExit("Không tìm thấy </head>")
          else:
              print("CSS already present")

          index.write_text(source, encoding="utf-8")
          print("PASS: đã thay emoji 🔊 bằng SVG loa rõ ràng")

          # Bump cache
          sw = Path("sw.js")
          sw_source = sw.read_text(encoding="utf-8")
          cache_name = "hoc-trung-app-shell-v42-9-3-speaker-svg-20261118"
          updated = re.sub(r"const CACHE_NAME = '[^']+';", f"const CACHE_NAME = '{cache_name}';", sw_source, count=1)
          if updated == sw_source and cache_name not in sw_source:
              # try another pattern
              updated = re.sub(r'CACHE_NAME\s*=\s*["\'][^"\']+["\']', f'CACHE_NAME = "{cache_name}"', sw_source, count=1)
          sw.write_text(updated, encoding="utf-8")
          print("PASS: đã bump CACHE_NAME")
          PY
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Không có thay đổi cần commit."
            exit 0
          fi
          git commit -m "Fix speaker icons in menu 16.1: replace white emoji with clear SVG speaker"
          git push origin HEAD:main
