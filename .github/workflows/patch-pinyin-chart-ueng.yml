name: Patch Pinyin chart ueng and w-series
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-pinyin-chart-ueng.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Pinyin chart data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          old_cols = 'const COLS=["a","o","e","-i","er","ai","ei","ao","ou","an","en","ang","eng","ong","i","ia","iao","ie","iu","ian","in","iang","ing","iong","u","ua","uo","uai","ui","uan","un","uang","ü","üe","üan","ün"];'
          new_cols = 'const COLS=["a","o","e","-i","er","ai","ei","ao","ou","an","en","ang","eng","ong","i","ia","iao","ie","iu","ian","in","iang","ing","iong","u","ua","uo","uai","ui","uan","un","uang","ueng","ü","üe","üan","ün"];'
          if old_cols in source:
              source = source.replace(old_cols, new_cols, 1)
          elif new_cols not in source:
              raise SystemExit("Không tìm thấy định nghĩa COLS đúng phiên bản; dừng để tránh sửa sai.")

          m = re.search(r'const CELLS=(\[.*?\]);\nconst AUDIO_BASE=', source, re.S)
          if not m:
              raise SystemExit("Không tìm thấy khối CELLS; dừng để tránh sửa sai.")
          cells = json.loads(m.group(1))
          if len(cells) != 23 or any(len(row) != 36 for row in cells):
              raise SystemExit(f"Kích thước CELLS không như dự kiến: {len(cells)} hàng; độ dài {[len(r) for r in cells]}")
          w_index = 22
          wrow = cells[w_index]
          # Remove the two entries currently placed under -ang/-eng.
          if wrow[11] not in ("wang", "") or wrow[12] not in ("weng", ""):
              raise SystemExit(f"Dữ liệu hàng w khác dự kiến: cột ang={wrow[11]!r}, eng={wrow[12]!r}")
          wrow[11] = ""
          wrow[12] = ""
          for row in cells:
              row.insert(32, "")
          cells[w_index][31] = "wang"   # zero-initial form of uang
          cells[w_index][32] = "weng"   # zero-initial form of ueng
          new_cells = "const CELLS=" + json.dumps(cells, ensure_ascii=False, separators=(",", ":")) + ";\nconst AUDIO_BASE="
          source = source[:m.start()] + new_cells + source[m.end():]

          # Add a first-tone sample for the new ueng column; preserve all existing samples.
          old_samples = "['wu'],['wa'],['wo'],['wai'],['wei'],['wan'],['wen'],['wang'],\n ['yu'],['yue'],['yuan'],['yun']"
          new_samples = "['wu'],['wa'],['wo'],['wai'],['wei'],['wan'],['wen'],['wang'],['weng'],\n ['yu'],['yue'],['yuan'],['yun']"
          if old_samples in source:
              source = source.replace(old_samples, new_samples, 1)
          elif new_samples not in source:
              raise SystemExit("Không tìm thấy đoạn FINAL_SAMPLES cuối bảng.")

          source = source.replace("function groupClass(index){return index<14?'aeo':index<24?'i':index<32?'u':'ue';}",
                                  "function groupClass(index){return index<14?'aeo':index<24?'i':index<33?'u':'ue';}", 1)

          path.write_text(source, encoding="utf-8")
          print("Đã cập nhật COLS=37, CELLS=23x37, hàng w: wang dưới uang và weng dưới ueng; FINAL_SAMPLES có weng.")
          PY
      - name: Verify chart data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          s=Path("index.html").read_text(encoding="utf-8")
          cols=re.search(r'const COLS=(\[.*?\]);',s).group(1)
          cols=json.loads(cols)
          cells=json.loads(re.search(r'const CELLS=(\[.*?\]);\nconst AUDIO_BASE=',s,re.S).group(1))
          assert len(cols)==37 and cols[31:33]==["uang","ueng"], cols
          assert len(cells)==23 and all(len(r)==37 for r in cells)
          assert cells[22][31:33]==["wang","weng"], cells[22]
          assert cells[6][22]=="ning"
          print("PASS:", len(cols), "vận mẫu; wang/weng đúng cột; ning được giữ nguyên.")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Pinyin chart: add ueng and align wang weng"
          git push origin main
