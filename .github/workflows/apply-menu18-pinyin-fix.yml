name: One-time Menu 18 Pinyin repair
on:
  push:
    paths:
      - ".github/workflows/apply-menu18-pinyin-fix.yml"
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch Menu 18 and verify JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          index = Path("index.html")
          source = index.read_text(encoding="utf-8")
          replacements = [
            (
              "const PINYIN18_COMMON_CHARACTERS={wo:'我',ni:'你',nin:'您',ta:'他',ai:'爱',leng:'冷',lei:'累',ma:'吗',hao:'好',bu:'不',dong:'懂',pa:'怕',hen:'很',shi:'是',you:'有',mei:'没',ne:'呢',yao:'要',xiang:'想',chi:'吃',he:'喝',shui:'水',jia:'家',qu:'去',lai:'来',zai:'在',zuo:'做',zhi:'知',dao:'道',shenme:'什么'};",
              "const PINYIN18_COMMON_CHARACTERS={wo:'我',ni:'你',nin:'您',ta:'他',ai:'爱',leng:'冷',lei:'累',ma:'吗',hao:'好',bu:'不',dong:'懂',pa:'怕',hen:'很',shi:'是',you:'有',mei:'没',ne:'呢',yao:'要',xiang:'想',chi:'吃',he:'喝',shui:'水',jia:'家',qu:'去',lai:'来',zai:'在',zuo:'做',zhi:'知',dao:'道',shenme:'什么',jin:'今',tian:'天',ke:'客',ren:'人',zhong:'中',guo:'国'};"
            ),
            (
              "function pinyin18Key(value){\n return String(value||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[üÜvV]/g,'u').replace(/[1-5]/g,'').toLowerCase().replace(/[^a-z]/g,'');\n}\nfunction getPinyin18Lexicon(){",
              "function pinyin18Key(value){\n return String(value||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[üÜvV]/g,'u').replace(/[1-5]/g,'').toLowerCase().replace(/[^a-z]/g,'');\n}\n// Keep syllable boundaries: \"tiān\" must not collide with \"tí àn\".\nfunction pinyin18LexiconKey(value){\n return String(value||'').trim().split(/\\s+/).map(pinyin18Key).filter(Boolean).join(' ');\n}\nfunction getPinyin18Lexicon(){"
            ),
            ("const key=pinyin18Key(row[2]);", "const key=pinyin18LexiconKey(row[2]);"),
            ("if([...String(row[0]||'')].length===1&&key.length<=6)syllables.add(key);", "if([...String(row[0]||'')].length===1&&!key.includes(' ')&&key.length<=6)syllables.add(key);"),
            ("for(const item of lexicon.get(key)||[]){", "for(const item of lexicon.get(pinyin18LexiconKey(raw))||[]){"),
            ("const syllable=syllables.slice(position,end).join(''),matches=lexicon.get(syllable);", "const syllable=syllables.slice(position,end).join(' '),matches=lexicon.get(syllable);"),
            ("if(list.length>28)list.length=28;", "if(list.length>128)list.length=128;"),
            ("const score=state.score+Math.min(wordLength,6)*1.5+(syllable.length>2?.2:0)-Math.log(item.rowIndex+1)*.015;", "const score=state.score+Math.min(wordLength,6)*1.5+(syllable.length>2?.2:0)-Math.log(item.rowIndex+1)*.015+(PINYIN18_COMMON_CHARACTERS[syllable]===item.row[0]?5:0);")
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old[:100]}")
              source = source.replace(old, new)
          index.write_text(source, encoding="utf-8", newline="")

          sw = Path("sw.js")
          sw_source = sw.read_text(encoding="utf-8")
          old_cache = "hoc-trung-app-shell-v42-9-5-offline-pages-20261121"
          new_cache = "hoc-trung-app-shell-v42-9-6-menu18-pinyin-fix-20261121"
          if sw_source.count(old_cache) != 1:
              raise SystemExit("Expected current Service Worker cache name exactly once")
          sw.write_text(sw_source.replace(old_cache, new_cache), encoding="utf-8", newline="")

          # Syntax-check every inline JavaScript block (skip external and data-only scripts).
          blocks = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', source, re.I)
          checked = 0
          with tempfile.TemporaryDirectory() as tmp:
              for attrs, code in blocks:
                  if re.search(r'\bsrc\s*=', attrs, re.I) or re.search(r'type\s*=\s*["]text/plain["]', attrs, re.I):
                      continue
                  path = Path(tmp) / f"inline-{checked}.js"
                  path.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
                  checked += 1
          if checked < 1:
              raise SystemExit("No inline JavaScript blocks were checked")

          # This workflow is deliberately one-shot; remove it in the same repair commit.
          Path(".github/workflows/apply-menu18-pinyin-fix.yml").unlink()
          PY
          git diff --check
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(menu18): preserve pinyin syllable boundaries and phrase candidates"
          git push origin HEAD:main
