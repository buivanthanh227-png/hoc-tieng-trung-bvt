name: Build and deploy Học Tiếng Trung
# Trigger Pages from the latest main commit, including the visible Pinyin color-group patch.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Vendor Pinyin MP3", "Patch Pinyin chart ueng and w-series", "Patch Pinyin final color groups"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn ứng dụng
        uses: actions/checkout@v4

      - name: Cài Node.js cho regression tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Áp dụng và commit sửa lỗi V42.10.23 vào nguồn main
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v4222_requested_fixes.py index.html
          python3 tools/patch_android_chrome_speech.py index.html
          python3 tools/patch_v421023_menu3_runtime.py index.html
          python3 tools/patch_menu3_tone_selector.py index.html
          python3 tools/patch_menu3_full_results.py index.html
          python3 tools/patch_unified_17_menu_headings.py index.html
          git diff --check
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Apply V42.10.23 Menu 1 Menu 3 and responsive layout fixes"
            git push origin HEAD:main
          fi

      - name: Ghi nhận mã nguồn được đóng gói
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.webmanifest", encoding="utf-8"))["name"].rsplit("· ", 1)[-1])')"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Chuẩn bị thư mục site
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.build-meta.outputs.sha }}
          APP_VERSION: ${{ steps.build-meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p site

          # Mã nguồn đã chứa toàn bộ sửa chữa; deploy nguyên trạng index.html.
          # Không patch lại ở artifact để tránh workflow ghi đè/gây trùng Menu 3,
          # Menu 18, banner, footer hoặc bộ nạp từ điển.
          cp index.html site/
          node --test qa-tests/*.test.cjs
          python3 tools/test_menu3_full_results.py site/index.html menu3-pinyin-fix-v42.10.23.js
          python3 -m py_compile tools/*.py
          python3 tools/test_menu18_word_mapping.py site/index.html
          python3 tools/test_menu3_clone.py site/index.html
          python3 tools/test_menu3_ui_fix.py site/index.html
          python3 tools/test_brand_header.py site/index.html
          python3 tools/test_unified_17_menu_headings.py site/index.html
          python3 tools/test_menu1_dictionary_search.py site/index.html
          python3 tools/test_requested_ui_20261123.py site/index.html
          python3 tools/test_requested_ui_20261123_v2.py site/index.html
          # Verify the dictionary starts empty rather than rendering the first ten entries.
          grep -Fq 'if(!hasQuery){filteredIndices=[];}' site/index.html
          # Synchronize every visible legacy app version in one anchored pass.
          # The previous chained grep/sed logic matched prefixes such as 42.10.1
          # inside 42.10.13, corrupting the version and aborting deployment.
          python3 - <<'PY'
          import json, pathlib, re
          manifest = json.loads(pathlib.Path("manifest.webmanifest").read_text(encoding="utf-8"))
          target = manifest["name"].rsplit("· ", 1)[-1]
          if target != "V42.10.23":
              raise SystemExit(f"Unexpected release version in manifest: {target}")
          path = pathlib.Path("site/index.html")
          html = path.read_text(encoding="utf-8")
          version_pattern = re.compile(r"(?<![0-9.])42\.(?:9\.[3-9]|10\.[0-9]+)(?![0-9.])")
          html, replacements = version_pattern.subn("42.10.23", html)
          if replacements == 0:
              raise SystemExit("No legacy application version found in built HTML")
          stale_pattern = re.compile(r"(?<![0-9.])42\.(?:9\.[3-9]|10\.(?:[0-9]|1[0-9]))(?![0-9.])")
          remaining = sorted(set(stale_pattern.findall(html)))
          if remaining:
              raise SystemExit(f"Legacy version strings remain: {remaining}")
          if html.count("42.10.23") < 1:
              raise SystemExit("Built HTML does not expose V42.10.23")
          path.write_text(html, encoding="utf-8")
          print(f"Version synchronization PASS: {replacements} version occurrence(s) → V42.10.23")
          PY
          python3 - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("manifest.webmanifest").read_text(encoding="utf-8"))
          version = manifest["name"].rsplit("· ", 1)[-1]
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          sw = pathlib.Path("sw.js").read_text(encoding="utf-8")
          if version != "V42.10.23":
              raise SystemExit(f"Manifest version mismatch: {version}")
          if f"Phiên bản phát hành hiện tại: **{version}**." not in readme:
              raise SystemExit("README version does not match manifest")
          if "app-shell-v42-10-23-" not in sw:
              raise SystemExit("Service Worker cache version does not match manifest")
          if "menu3-pinyin-fix-v42.10.23.js" not in sw or "injectMenu3RuntimeFix" not in sw:
              raise SystemExit("Service Worker chưa nạp bản sửa Pinyin của Menu 3")
          print("Manifest, README and Service Worker version synchronization: PASS")
          PY
          # Các tài nguyên PWA cốt lõi phải có mặt; thiếu thì dừng deploy.
          for required in manifest.webmanifest sw.js luyen-so/index.html menu3-pinyin-fix-v42.10.23.js; do
            if [ ! -f "$required" ]; then
              echo "::error::Thiếu tài nguyên bắt buộc: $required"
              exit 1
            fi
          done
          cp manifest.webmanifest site/
          [ -f icon.svg ] && cp icon.svg site/ || true

          # PWA install icons: these files are referenced by manifest.webmanifest
          # and index.html. Fail the build rather than silently deploying 404s.
          for icon in icon-v41-192.png icon-v41-512.png apple-touch-icon-v41.png; do
            if [ ! -f "$icon" ]; then
              echo "::error::Thiếu PWA icon bắt buộc: $icon"
              exit 1
            fi
            cp "$icon" site/
          done

          cp sw.js site/
          cp menu3-pinyin-fix-v42.10.23.js site/
          node --check menu3-pinyin-fix-v42.10.23.js
          python3 tools/test_menu3_runtime_delivery.py site/index.html menu3-pinyin-fix-v42.10.23.js

          # Copy optional worker scripts when present so source paths and
          # Service Worker precache paths resolve to published files.
          for worker in asr-worker.js asr-voice-worker.js asr-cloudflare-worker.js ocr-worker.js; do
            if [ -f "$worker" ]; then
              cp "$worker" site/
            else
              echo "::warning::Không có worker tùy chọn: $worker"
            fi
          done

          [ -d audio/pinyin ] && mkdir -p site/audio && cp -a audio/pinyin site/audio/ || true

          # Publish the number-practice app at /luyen-so/ (not the retired
          # root-level luyen-so-tieng-trung.html path).
          mkdir -p site/luyen-so
          cp -a luyen-so/. site/luyen-so/

          # Public, non-sensitive build identity used by deployment verification.
          printf '{\n  "git_sha": "%s",\n  "version": "%s"\n}\n' "$SOURCE_SHA" "$APP_VERSION" > site/build-info.json

          # Tắt xử lý Jekyll để giữ nguyên cấu trúc thư mục và tệp
          : > site/.nojekyll

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages

      # Give the artifact service time to register the upload before deploy-pages lists it.
      - name: Chờ GitHub ghi nhận gói website
        shell: bash
        run: sleep 10

      - name: Xuất bản website
        id: deployment
        uses: actions/deploy-pages@v4
    
      - name: Xác minh commit đang chạy trên Production
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ steps.build-meta.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          for attempt in $(seq 1 12); do
            if body="$(curl --fail --silent --show-error --location --max-time 15 "$BASE_URL/build-info.json" 2>/dev/null)"; then
              if actual_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha", ""))' <<< "$body" 2>/dev/null)" && [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                html="$(curl --fail --silent --show-error --location --max-time 20 "$BASE_URL/index.html")"
                if grep -q 'id="panel-translate-experimental"\|data-tab="translate-experimental"' <<< "$html"; then
                  echo "::error::Production vẫn còn Menu 18."
                  exit 1
                fi
                for marker in 'BVT_REQUESTED_UI_20261123_V1' 'id="bvt-menu3-modal-equal-font"' '.homework3x-modal-line.is-pinyin .homework3x-modal-value' 'id="bvt-banner-footer-layout-v1"' 'id="bvt-footer-meta-move-v1"' 'id="bvt-menu1-colored-actions-v1' 'if(!hasQuery){filteredIndices=[];}' 'BVT_REQUESTED_UI_20261123_V2' 'id="bvt-banner-footer-layout-v2"' 'id="bvt-footer-meta-move-v2"' "getElementById('bvt-header-clock')" "window.__menu1DictionaryLoaded=function(count,sourceName)" 'BVT_ANDROID_CHROME_SPEECH_FIX_V1' 'id="bvt-unified-17-menu-headings-v2"' 'id="bvt-unified-17-menu-headings-runtime-v2"'; do
                  if ! grep -Fq "$marker" <<< "$html"; then
                    echo "::error::Production thiếu cập nhật giao diện: $marker"
                    exit 1
                  fi
                done
                for marker in 'BVT_MENU3_FULL_RESULTS_RENDERER_BRIDGE_V1' 'window.renderHomework3xCandidatesV421023' 'MENU3_INDEPENDENT_COPY_OF_MENU18_V1' 'id="panel-translate3"' 'data-tab="translate3"' 'id="homework3x-query"' 'async function lookupHomework3x()' 'runLongTranslation3x' 'runFileTranslation3x'; do
                  if ! grep -Fq "$marker" <<< "$html"; then
                    echo "::error::Production thiếu Menu 3 độc lập: $marker"
                    exit 1
                  fi
                done
                for marker in 'MENU3_UI_COLOR_AND_LOOKUP_FIX_V1' 'id="menu3-independent-lookup-binding"' "BVT_FUNCTION_COLORS.translate3={main:'#0891b2',alt:'#0e7490'};" "button.addEventListener('click',()=>{lookupHomework3x();});" 'BVT_FLAGS_AND_SPLIT_SLOGANS_V3' '.topbar .brand-slogan>span:first-child{grid-column:1!important;grid-row:2!important' '.topbar .brand-slogan>span:last-child{grid-column:3!important;grid-row:2!important' 'id="bvt-dictionary-count-placement"' '#main-tabs .tab[data-tab="dict"] .count-pill' 'homework3x-output-row' 'homework3x-modal-backdrop'; do
                  if ! grep -Fq "$marker" <<< "$html"; then
                    echo "::error::Production thiếu sửa lỗi Menu 3/banner: $marker"
                    exit 1
                  fi
                done
                flag_count="$(grep -o 'class="brand-flag"' <<< "$html" | wc -l | tr -d ' ')"
                if [ "$flag_count" != "2" ] || grep -q 'bvt-brand-banner\|bvt-brand-flag' <<< "$html"; then
                  echo "::error::Banner không giữ đúng hai lá cờ, số từ điển hoặc còn banner/cờ trùng."
                  exit 1
                fi

                patch_js="$(curl --fail --silent --show-error --location --max-time 15 "$BASE_URL/menu3-pinyin-fix-v42.10.23.js")"
                for marker in 'font-size:clamp(21px,5.2vw,27px)!important' 'window.renderHomework3xCandidatesV421023=renderCandidates' 'const token=++renderToken;let page=0;const pageSize=10' 'window.machineTranslate3x(String(item.zh),'\''zh-CN'\'','\''vi'\'')' 'window.openHomework3xCandidateModal(item,index,source.length)' 'data-copy="hanzi"' 'data-copy="pinyin"' 'data-copy="meaning"' 'data-speak="zh"' 'data-speak="vi"'; do
                  if ! grep -Fq "$marker" <<< "$patch_js"; then
                    echo "::error::Production thiếu hiển thị kết quả đầy đủ hoặc hộp thoại Menu 3: $marker"
                    exit 1
                  fi
                done
                if ! grep -Fq "dataset.menu3PinyinFix='42.10.23'" <<< "$patch_js"; then
                  echo "::error::Production không phục vụ đúng Menu 3 Pinyin hotfix."
                  exit 1
                fi
                live_sw="$(curl --fail --silent --show-error --location --max-time 15 "$BASE_URL/sw.js")"
                if ! grep -Fq "menu3-pinyin-fix-v42.10.23.js" <<< "$live_sw"; then
                  echo "::error::Production Service Worker chưa nạp Menu 3 Pinyin hotfix."
                  exit 1
                fi

                echo "Production đang phục vụ đúng commit $EXPECTED_SHA; banner căn theo hai lá cờ, đồng hồ và ghi công ở chân trang, từ điển nhúng đã kiểm tra 120.000+ mục, Menu 3/1 và 17 menu đã xác minh."
                exit 0
              fi
            fi
            echo "Chưa thấy build SHA mong đợi trên Production (lần $attempt/12)."
            sleep 5
          done
          echo "::error::Production không xác nhận được commit $EXPECTED_SHA."
          exit 1
