name: Build and deploy Học Tiếng Trung
# Trigger Pages from the latest main commit, including the visible Pinyin color-group patch.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Vendor Pinyin MP3", "Patch Pinyin chart ueng and w-series", "Patch Pinyin final color groups"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn ứng dụng
        uses: actions/checkout@v4

      - name: Ghi nhận mã nguồn được đóng gói
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.webmanifest", encoding="utf-8"))["name"].rsplit("· ", 1)[-1])')"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Chuẩn bị thư mục site
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.build-meta.outputs.sha }}
          APP_VERSION: ${{ steps.build-meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p site

          # Trang chính hiện tại
          cp index.html site/
          # Patch only Menu 18 on the deploy artifact; keep the large embedded dictionary source intact.
          python3 tools/patch_menu18_ranking.py site/index.html
          # Keep the visible footer version aligned with manifest.webmanifest.
          if grep -q '42.9.3' site/index.html; then
            sed -i 's/42\.9\.3/42.9.4/g' site/index.html
          fi
          if grep -q '42.9.4' site/index.html; then
            sed -i 's/42\.9\.4/42.9.5/g' site/index.html
          fi
          if grep -Eq '42\.9\.[34]' site/index.html; then
            echo "::error::Footer version is not aligned with V42.9.5."
            exit 1
          fi

          # Các tài nguyên PWA cốt lõi phải có mặt; thiếu thì dừng deploy.
          for required in manifest.webmanifest sw.js luyen-so/index.html; do
            if [ ! -f "$required" ]; then
              echo "::error::Thiếu tài nguyên bắt buộc: $required"
              exit 1
            fi
          done
          cp manifest.webmanifest site/
          [ -f icon.svg ] && cp icon.svg site/ || true

          # PWA install icons: these files are referenced by manifest.webmanifest
          # and index.html. Fail the build rather than silently deploying 404s.
          for icon in icon-v41-192.png icon-v41-512.png apple-touch-icon-v41.png; do
            if [ ! -f "$icon" ]; then
              echo "::error::Thiếu PWA icon bắt buộc: $icon"
              exit 1
            fi
            cp "$icon" site/
          done

          cp sw.js site/

          # Copy optional worker scripts when present so source paths and
          # Service Worker precache paths resolve to published files.
          for worker in asr-worker.js asr-voice-worker.js asr-cloudflare-worker.js ocr-worker.js; do
            if [ -f "$worker" ]; then
              cp "$worker" site/
            else
              echo "::warning::Không có worker tùy chọn: $worker"
            fi
          done

          [ -d audio/pinyin ] && mkdir -p site/audio && cp -a audio/pinyin site/audio/ || true

          # Publish the number-practice app at /luyen-so/ (not the retired
          # root-level luyen-so-tieng-trung.html path).
          mkdir -p site/luyen-so
          cp -a luyen-so/. site/luyen-so/

          # Public, non-sensitive build identity used by deployment verification.
          printf '{\n  "git_sha": "%s",\n  "version": "%s"\n}\n' "$SOURCE_SHA" "$APP_VERSION" > site/build-info.json

          # Tắt xử lý Jekyll để giữ nguyên cấu trúc thư mục và tệp
          : > site/.nojekyll

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          # Unique per workflow attempt: retries must not leave duplicate github-pages artifacts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Xuất bản website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Xác minh commit đang chạy trên Production
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ steps.build-meta.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          for attempt in $(seq 1 12); do
            if body="$(curl --fail --silent --show-error --location --max-time 15 "$BASE_URL/build-info.json" 2>/dev/null)"; then
              if actual_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha", ""))' <<< "$body" 2>/dev/null)" && [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                echo "Production đang phục vụ đúng commit $EXPECTED_SHA."
                exit 0
              fi
            fi
            echo "Chưa thấy build SHA mong đợi trên Production (lần $attempt/12)."
            sleep 5
          done
          echo "::error::Production không xác nhận được commit $EXPECTED_SHA."
          exit 1
