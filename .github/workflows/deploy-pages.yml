name: Build and deploy Học Tiếng Trung

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn ứng dụng
        uses: actions/checkout@v4

      - name: Chuẩn bị thư mục site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          # Trang chính hiện tại
          cp index.html site/
          [ -f manifest.webmanifest ] && cp manifest.webmanifest site/ || true
          [ -f icon.svg ] && cp icon.svg site/ || true
          [ -f sw.js ] && cp sw.js site/ || true

          # Đưa toàn bộ ứng dụng luyện số vào website ở /luyen-so/
          if [ ! -f luyen-so/index.html ]; then
            echo "::error::Không tìm thấy luyen-so/index.html trong nhánh main."
            exit 1
          fi
          mkdir -p site/luyen-so
          cp -a luyen-so/. site/luyen-so/

          # Tắt xử lý Jekyll để giữ nguyên cấu trúc thư mục và tệp
          : > site/.nojekyll

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Xuất bản website
        id: deployment
        uses: actions/deploy-pages@v4
