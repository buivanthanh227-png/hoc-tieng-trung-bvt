name: Build and deploy Học Tiếng Trung
# Trigger Pages from the latest main commit, including the visible Pinyin color-group patch.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Vendor Pinyin MP3", "Patch Pinyin chart ueng and w-series", "Patch Pinyin final color groups"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn ứng dụng
        uses: actions/checkout@v4

      - name: Ghi nhận mã nguồn được đóng gói
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.webmanifest", encoding="utf-8"))["name"].rsplit("· ", 1)[-1])')"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Chuẩn bị thư mục site
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.build-meta.outputs.sha }}
          APP_VERSION: ${{ steps.build-meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p site

          # Trang chính hiện tại
          cp index.html site/
          # Patch only Menu 18 on the deploy artifact; keep the large embedded dictionary source intact.
          python3 -m py_compile tools/patch_menu18_ranking.py tools/patch_menu18_word_mapping.py tools/patch_menu18_multicandidate.py tools/test_menu18_word_mapping.py tools/patch_menu1_dictionary_search.py tools/test_menu1_dictionary_search.py tools/patch_brand_header.py tools/test_brand_header.py tools/patch_menu3_clone.py tools/test_menu3_clone.py
          python3 tools/patch_menu18_ranking.py site/index.html
          python3 tools/patch_menu18_word_mapping.py site/index.html
          python3 tools/patch_menu18_multicandidate.py site/index.html
          python3 tools/test_menu18_word_mapping.py site/index.html
          # Menu 3 is an independent clone of Menu 18; keep the old Menu 3 panel and Menu 18 backup intact.
          python3 tools/patch_menu3_clone.py site/index.html
          python3 tools/test_menu3_clone.py site/index.html
          python3 tools/patch_brand_header.py site/index.html
          python3 tools/test_brand_header.py site/index.html
          # Menu 1: independent Hanzi, Pinyin/tone, and Vietnamese search fields.
          python3 tools/patch_menu1_dictionary_search.py site/index.html
          python3 tools/test_menu1_dictionary_search.py site/index.html
          # Keep the visible footer version aligned with manifest.webmanifest.
          if grep -q '42.9.3' site/index.html; then
            sed -i 's/42[.]9[.]3/42.9.4/g' site/index.html
          fi
          if grep -q '42.9.4' site/index.html; then
            sed -i 's/42[.]9[.]4/42.9.5/g' site/index.html
          fi
          if grep -q '42.9.5' site/index.html; then
            sed -i 's/42[.]9[.]5/42.9.6/g' site/index.html
          fi
          if grep -q '42.9.6' site/index.html; then
            sed -i 's/42[.]9[.]6/42.9.7/g' site/index.html
          fi
          if grep -q '42.9.7' site/index.html; then
            sed -i 's/42[.]9[.]7/42.9.8/g' site/index.html
          fi
          if grep -q '42.9.8' site/index.html; then
            sed -i 's/42[.]9[.]8/42.9.9/g' site/index.html
          fi
          if grep -q '42.9.9' site/index.html; then
            sed -i 's/42[.]9[.]9/42.10.0/g' site/index.html
          fi
          if grep -q '42.10.0' site/index.html; then
            sed -i 's/42[.]10[.]0/42.10.1/g' site/index.html
          fi
          if grep -q '42.10.1' site/index.html; then
            sed -i 's/42[.]10[.]1/42.10.3/g' site/index.html
          fi
          if grep -q '42.10.3' site/index.html; then
            sed -i 's/42[.]10[.]3/42.10.4/g' site/index.html
          fi
          if grep -q '42.10.4' site/index.html; then
            sed -i 's/42[.]10[.]4/42.10.5/g' site/index.html
          fi
          if grep -q '42.10.5' site/index.html; then
            sed -i 's/42[.]10[.]5/42.10.6/g' site/index.html
          fi
          if grep -q '42.10.6' site/index.html; then
            sed -i 's/42[.]10[.]6/42.10.7/g' site/index.html
          fi
          if grep -q '42.10.7' site/index.html; then
            sed -i 's/42[.]10[.]7/42.10.8/g' site/index.html
          fi
          if grep -q '42.10.8' site/index.html; then
            sed -i 's/42[.]10[.]8/42.10.9/g' site/index.html
          fi
          if grep -Eq '42[.]9[.][3456789]|42[.]10[.]0|42[.]10[.]1|42[.]10[.]3|42[.]10[.]4|42[.]10[.]5|42[.]10[.]6|42[.]10[.]7|42[.]10[.]8' site/index.html; then
            echo "::error::Footer version is not aligned with V42.10.9."
            exit 1
          fi

          # Các tài nguyên PWA cốt lõi phải có mặt; thiếu thì dừng deploy.
          for required in manifest.webmanifest sw.js luyen-so/index.html; do
            if [ ! -f "$required" ]; then
              echo "::error::Thiếu tài nguyên bắt buộc: $required"
              exit 1
            fi
          done
          cp manifest.webmanifest site/
          [ -f icon.svg ] && cp icon.svg site/ || true

          # PWA install icons: these files are referenced by manifest.webmanifest
          # and index.html. Fail the build rather than silently deploying 404s.
          for icon in icon-v41-192.png icon-v41-512.png apple-touch-icon-v41.png; do
            if [ ! -f "$icon" ]; then
              echo "::error::Thiếu PWA icon bắt buộc: $icon"
              exit 1
            fi
            cp "$icon" site/
          done

          cp sw.js site/

          # Copy optional worker scripts when present so source paths and
          # Service Worker precache paths resolve to published files.
          for worker in asr-worker.js asr-voice-worker.js asr-cloudflare-worker.js ocr-worker.js; do
            if [ -f "$worker" ]; then
              cp "$worker" site/
            else
              echo "::warning::Không có worker tùy chọn: $worker"
            fi
          done

          [ -d audio/pinyin ] && mkdir -p site/audio && cp -a audio/pinyin site/audio/ || true

          # Publish the number-practice app at /luyen-so/ (not the retired
          # root-level luyen-so-tieng-trung.html path).
          mkdir -p site/luyen-so
          cp -a luyen-so/. site/luyen-so/

          # Public, non-sensitive build identity used by deployment verification.
          printf '{\n  "git_sha": "%s",\n  "version": "%s"\n}\n' "$SOURCE_SHA" "$APP_VERSION" > site/build-info.json

          # Tắt xử lý Jekyll để giữ nguyên cấu trúc thư mục và tệp
          : > site/.nojekyll

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages

      # Give the artifact service time to register the upload before deploy-pages lists it.
      - name: Chờ GitHub ghi nhận gói website
        shell: bash
        run: sleep 10

      - name: Xuất bản website
        id: deployment
        uses: actions/deploy-pages@v4
    
      - name: Xác minh commit đang chạy trên Production
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ steps.build-meta.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          for attempt in $(seq 1 12); do
            if body="$(curl --fail --silent --show-error --location --max-time 15 "$BASE_URL/build-info.json" 2>/dev/null)"; then
              if actual_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha", ""))' <<< "$body" 2>/dev/null)" && [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                html="$(curl --fail --silent --show-error --location --max-time 20 "$BASE_URL/index.html")"
                if ! grep -q 'MENU18_MULTICANDIDATE_SENTENCE_SEARCH' <<< "$html" || ! grep -q 'function pinyin18SelectToneDiverse' <<< "$html"; then
                  echo "::error::Production thiếu bộ tìm kiếm nhiều phương án thanh điệu cho toàn câu Menu 18."
                  exit 1
                fi
                if grep -q 'MENU18_INDEPENDENT_TOKEN_MAPPING_V1' <<< "$html"; then
                  echo "::error::Production vẫn chứa logic tra từng âm tiết độc lập đã bị loại bỏ."
                  exit 1
                fi
                for marker in 'state.rows.concat([item.row])' 'if(ranked.length)add(ranked[0]);' 'async function renderHomework18Candidates(candidates)' 'await renderHomework18Candidates(candidates)' 'found.size);' 'MENU18_SINGLE_POSITION_TONE_VARIANTS_V1' 'homework18-modal-backdrop' 'homework18PageSize=10' 'data-page-prev' 'data-page-next' 'formatHomework18PinyinByInput' 'split(/[\s,，、;；]+/)' 'homework18ModalClickBound' 'Không tìm thấy kết quả khớp chính xác' 'MENU1_THREE_FIELD_DICTIONARY_SEARCH_V1' 'dict-search-hanzi' 'dict-search-pinyin' 'dict-search-meaning' 'data-dict-tone="5"' 'homework18-candidate-vi' 'await Promise.all('; do
                  if ! grep -Fq "$marker" <<< "$html"; then
                    echo "::error::Production thiếu logic Menu 18: $marker"
                    exit 1
                  fi
                done
                for marker in 'data-homework18-copy="hanzi"' 'data-homework18-copy="pinyin"' 'data-homework18-copy="meaning"' 'data-homework18-speak="zh"' 'data-homework18-speak="vi"' 'navigator.clipboard.writeText(value)' "document.execCommand('copy')" 'const playHanziSentence=()=>speakMandarinSentence(zh,0.92)' 'homework18QueryInput.addEventListener'; do
                  if ! grep -Fq "$marker" <<< "$html"; then
                    echo "::error::Production thiếu thao tác copy/audio/status Menu 18: $marker"
                    exit 1
                  fi
                done

                if grep -q 'data-homework18-speak="py"' <<< "$html" || grep -q 'const playPinyinWords=async()=>{' <<< "$html"; then
                  echo "::error::Production vẫn chứa chức năng phát Pinyin đã được yêu cầu gỡ bỏ."
                  exit 1
                fi
                for marker in 'MENU3_INDEPENDENT_COPY_OF_MENU18_V1' 'id="panel-translate3"' 'data-tab="translate3"' 'id="homework3x-query"' 'async function lookupHomework3x()' 'runLongTranslation3x' 'runFileTranslation3x'; do
                  if ! grep -Fq "$marker" <<< "$html"; then
                    echo "::error::Production thiếu Menu 3 độc lập: $marker"
                    exit 1
                  fi
                done
                if ! grep -q 'left.append(leftText);center.append(title);right.append(rightText);' <<< "$html" || grep -q 'bvt-brand-flag' <<< "$html"; then
                  echo "::error::Banner vẫn có cờ trùng hoặc thiếu bố cục đã sửa."
                  exit 1
                fi

                echo "Production đang phục vụ đúng commit $EXPECTED_SHA và có Menu 3 độc lập, Menu 18 dự phòng và không phát Pinyin."
                exit 0
              fi
            fi
            echo "Chưa thấy build SHA mong đợi trên Production (lần $attempt/12)."
            sleep 5
          done
          echo "::error::Production không xác nhận được commit $EXPECTED_SHA."
          exit 1
