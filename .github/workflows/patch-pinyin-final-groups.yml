name: Patch Pinyin final color groups
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-pinyin-final-groups.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patch-pinyin-final-groups
  cancel-in-progress: false
jobs:
  patch-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply visible colors to Pinyin chart columns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          index = Path("index.html")
          source = index.read_text(encoding="utf-8")

          cols_match = re.search(r'const COLS=(\[.*?\]);', source)
          if not cols_match:
              raise SystemExit("Không tìm thấy COLS; dừng để tránh sửa nhầm.")
          cols = json.loads(cols_match.group(1))
          expected_basic = ["a","o","e","-i","er","ai","ei","ao","ou"]
          expected_nasal = ["an","en","ang","eng","ong"]
          if cols[:9] != expected_basic or cols[9:14] != expected_nasal:
              raise SystemExit(f"Thứ tự vận mẫu không đúng yêu cầu: {cols[:14]}")

          group_logic = "function groupClass(index){return index<9?'basic':index<14?'nasal':index<24?'i':index<33?'u':'ue';}"
          if group_logic not in source:
              raise SystemExit("Không tìm thấy logic nhóm cột đã thống nhất.")

          # The generated HTML must carry the group class on both header rows and every body cell.
          required_markup = [
              '<th class="p16-column-action p16-group-\u0024{groupClass(i)}">',
              '<th class="p16-final-head p16-group-\u0024{groupClass(i)}">',
              '<td class="p16-group-cell p16-group-\u0024{groupClass(ci)}">',
              '<td class="p16-group-cell p16-group-\u0024{groupClass(ci)}"></td>',
          ]
          for fragment in required_markup:
              if fragment.replace("\\u0024", "$") not in source:
                  raise SystemExit("Thiếu gắn class nhóm màu trong HTML được render: " + fragment)

          style_id = "bvt-pinyin-final-groups-20261118"
          style = """
          <style id="bvt-pinyin-final-groups-20261118">
          /* Bảng 16.1: nhóm a–ou màu xanh dương; an–ong màu xanh ngọc.
             Tô cả ô dữ liệu và nút phát âm bên trong để màu không bị che khuất. */
          #panel-pinyin-audio .p16-chart-table thead th.p16-group-basic{background:#2563eb!important;color:#fff!important}
          #panel-pinyin-audio .p16-chart-table thead th.p16-group-basic button:not(.p16-playing){background:#1d4ed8!important;color:#fff!important;border-color:#1e40af!important}
          #panel-pinyin-audio .p16-chart-table tbody td.p16-group-basic{background:#dbeafe!important}
          #panel-pinyin-audio .p16-chart-table tbody td.p16-group-basic .p16-cell-play:not(.p16-playing){background:#eff6ff!important;color:#1e40af!important;border-color:#93c5fd!important}

          #panel-pinyin-audio .p16-chart-table thead th.p16-group-nasal{background:#0f766e!important;color:#fff!important}
          #panel-pinyin-audio .p16-chart-table thead th.p16-group-nasal button:not(.p16-playing){background:#0d9488!important;color:#fff!important;border-color:#0f766e!important}
          #panel-pinyin-audio .p16-chart-table tbody td.p16-group-nasal{background:#ccfbf1!important}
          #panel-pinyin-audio .p16-chart-table tbody td.p16-group-nasal .p16-cell-play:not(.p16-playing){background:#f0fdfa!important;color:#115e59!important;border-color:#5eead4!important}
          </style>
          """
          style_pattern = re.compile(r'<style id="' + re.escape(style_id) + r'">.*?</style>', re.S)
          if style_pattern.search(source):
              source, replaced = style_pattern.subn(lambda _: style.strip(), source, count=1)
              if replaced != 1:
                  raise SystemExit("Không thể thay thế đúng khối CSS nhóm màu.")
          else:
              if "</head>" not in source:
                  raise SystemExit("Không tìm thấy </head> để chèn CSS.")
              source = source.replace("</head>", style + "\n</head>", 1)

          if source.count(f'id="{style_id}"') != 1:
              raise SystemExit("Khối CSS nhóm màu bị thiếu hoặc lặp.")

          index.write_text(source, encoding="utf-8")
          print("PASS: đã gắn màu trực tiếp lên header, ô trống và nút phát âm ở 9 cột a–ou / 5 cột an–ong.")

          sw = Path("sw.js")
          sw_source = sw.read_text(encoding="utf-8")
          cache_name = "hoc-trung-app-shell-v42-9-7-pinyin-visible-final-colors-20261118"
          updated = re.sub(r"const CACHE_NAME = '[^']+';", f"const CACHE_NAME = '{cache_name}';", sw_source, count=1)
          if updated == sw_source and cache_name not in sw_source:
              raise SystemExit("Không tìm thấy CACHE_NAME trong sw.js.")
          sw.write_text(updated, encoding="utf-8")
          print("PASS: đã đổi cache key để buộc tải lại app shell.")
          PY
      - name: Verify actual class-to-color mapping and cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          s = Path("index.html").read_text(encoding="utf-8")
          cols = json.loads(re.search(r'const COLS=(\[.*?\]);', s).group(1))
          assert cols[:9] == ["a","o","e","-i","er","ai","ei","ao","ou"]
          assert cols[9:14] == ["an","en","ang","eng","ong"]
          assert "function groupClass(index){return index<9?'basic':index<14?'nasal':index<24?'i':index<33?'u':'ue';}" in s
          assert '<th class="p16-column-action p16-group-\u0024{groupClass(i)}">' .replace("\\u0024","$") in s
          assert '<th class="p16-final-head p16-group-\u0024{groupClass(i)}">' .replace("\\u0024","$") in s
          assert '<td class="p16-group-cell p16-group-\u0024{groupClass(ci)}">' .replace("\\u0024","$") in s
          assert '#panel-pinyin-audio .p16-chart-table tbody td.p16-group-basic .p16-cell-play:not(.p16-playing){background:#eff6ff!important' in s
          assert '#panel-pinyin-audio .p16-chart-table tbody td.p16-group-nasal .p16-cell-play:not(.p16-playing){background:#f0fdfa!important' in s
          assert '#panel-pinyin-audio .p16-chart-table thead th.p16-group-basic button:not(.p16-playing){background:#1d4ed8!important' in s
          assert '#panel-pinyin-audio .p16-chart-table thead th.p16-group-nasal button:not(.p16-playing){background:#0d9488!important' in s
          sw = Path("sw.js").read_text(encoding="utf-8")
          assert "hoc-trung-app-shell-v42-9-7-pinyin-visible-final-colors-20261118" in sw
          print("PASS: 9 cột basic và 5 cột nasal; header + cell + nút audio đều nhận màu riêng; cache key mới.")
          PY
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Không có thay đổi cần commit."
            exit 0
          fi
          git commit -m "Make Pinyin final color groups visible in chart 16.1"
          git push origin HEAD:main
