<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Luyện Số Tiếng Trung V9</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --green: #059669;
      --red: #dc2626;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: max(10px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    .app {
      width: 100%; max-width: 520px; margin: 0 auto; padding: 18px;
      display: flex; flex-direction: column; gap: 14px;
      background: var(--card); border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    header { text-align: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .title-row { display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
    .brand-logo { width: 36px; height: 36px; flex: 0 0 36px; object-fit: contain; }
    h1 { margin: 0; color: var(--primary); font-size: 1.3rem; line-height: 1.35; }
    .credit {
      margin: 4px 0 0;
      color: #dc2626;
      font-size: .56rem;
      font-weight: 600;
      line-height: 1.35;
      text-align: right;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .mode-menu {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
    }
    .mode-btn {
      min-width: 0; min-height: 52px; padding: 9px 8px;
      border: 1px solid var(--line); border-radius: 11px;
      background: #f9fafb; color: #374151;
      font-size: .88rem; font-weight: 700; line-height: 1.3; text-align: left;
    }
    .mode-btn.active {
      border-color: var(--primary); background: #eef2ff; color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }
    .range-box {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 12px; background: #f9fafb; border: 1px solid var(--line); border-radius: 12px;
    }
    .range-box label, .settings-row label, .field-label { color: var(--muted); font-size: .86rem; font-weight: 650; }
    .range-inputs { display: flex; align-items: center; gap: 7px; }
    .range-inputs input {
      width: 76px; min-height: 40px; padding: 7px 5px; text-align: center;
      border: 1px solid #d1d5db; border-radius: 8px; background: white; font-size: 1rem; font-weight: 650;
    }
    .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 3px; }
    .settings-row input {
      width: 68px; min-height: 38px; padding: 6px; text-align: center;
      border: 1px solid #d1d5db; border-radius: 8px; background: white;
    }
    .display-card {
      min-height: 178px; padding: 22px 12px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; position: relative;
      background: #f9fafb; border: 2px solid var(--line); border-radius: 15px;
    }
    .num-display { color: var(--primary); font-size: clamp(2.4rem, 11vw, 3.3rem); font-weight: 850; line-height: 1.15; overflow-wrap: anywhere; }
    .zh-display { margin-top: 8px; font-size: 1.65rem; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
    .pinyin-display { margin-top: 3px; color: var(--green); font-size: 1.05rem; line-height: 1.5; overflow-wrap: anywhere; }
    .feedback { min-height: 1.4em; margin-top: 7px; font-size: .98rem; font-weight: 700; line-height: 1.4; }
    .feedback.correct { color: var(--green); }
    .feedback.wrong { color: var(--red); }
    .controls { display: flex; flex-direction: column; gap: 9px; }
    .btn-row { display: flex; gap: 9px; }
    .btn {
      flex: 1; min-width: 0; min-height: 46px; padding: 10px 8px; display: flex; align-items: center;
      justify-content: center; gap: 6px; border: 0; border-radius: 11px; font-size: .94rem;
      font-weight: 750; line-height: 1.25;
    }
    .btn:active, .mode-btn:active { transform: scale(.985); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-secondary { background: #e0e7ff; color: var(--primary); }
    .hidden { display: none !important; }
    .field-group { display: flex; flex-direction: column; gap: 7px; }
    .field-input {
      width: 100%; min-height: 48px; padding: 10px 12px;
      border: 2px solid #d1d5db; border-radius: 10px; background: #fff;
      text-align: center; font-size: 1.2rem; font-weight: 650;
    }
    .field-input:focus, .quiz-input-group input:focus { outline: none; border-color: var(--primary); }
    .quiz-input-group { display: flex; gap: 8px; }
    .quiz-input-group input {
      flex: 1; min-width: 0; min-height: 46px; padding: 9px; border: 2px solid #d1d5db;
      border-radius: 10px; text-align: center; font-size: 1.15rem;
    }
    .score { text-align: center; color: var(--muted); font-size: .88rem; }
    .score strong:first-child { color: var(--green); }
    .score strong:last-child { color: var(--red); }
    @media (max-width: 360px) {
      .app { padding: 13px; gap: 11px; }
      h1 { font-size: 1.18rem; }
      .brand-logo { width: 31px; height: 31px; flex-basis: 31px; }
      .title-row { gap: 7px; }
      .mode-btn { font-size: .8rem; padding: 8px 6px; }
      .btn { font-size: .84rem; }
      .range-inputs input { width: 65px; }
    }
  </style>
</head>

    <section id="rangeSettings" class="range-box hidden">
      <label for="minNum">Phạm vi số:</label>
      <div class="range-inputs">
        <input type="number" id="minNum" value="1" min="0" max="999999" step="1" inputmode="numeric" aria-label="Số bắt đầu">
        <span>–</span>
        <input type="number" id="maxNum" value="100" min="0" max="999999" step="1" inputmode="numeric" aria-label="Số kết thúc">
      </div>
    </section>

    <section id="delaySettings" class="settings-row hidden">
      <label for="delaySec">Khoảng nghỉ giữa các số (giây):</label>
      <input type="number" id="delaySec" value="5" min="0.1" step="0.1" inputmode="numeric">
    </section>

    <div id="voiceStatus" class="sr-only" role="status" aria-live="polite"></div>

    <section class="display-card" aria-live="polite">
      <div id="displayNum" class="num-display">--</div>
      <div id="displayZh" class="zh-display"></div>
      <div id="displayPinyin" class="pinyin-display"></div>
      <div id="feedbackText" class="feedback"></div>
    </section>

    <!-- 1. Đọc số nhập vào -->
    <section id="controls-single" class="controls">
      <div class="field-group">
        <label class="field-label" for="singleNum">Nhập số bạn muốn nghe (0–999.999):</label>
        <input class="field-input" type="number" id="singleNum" value="1" min="0" max="999999" step="1" inputmode="numeric">
      </div>
      <button type="button" class="btn btn-primary" id="btnSpeakSingle">🔊 Nghe phát âm số này</button>
    </section>

    <!-- 2 và 3. Đọc tăng/giảm dần -->
    <section id="controls-sequence" class="controls hidden">
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnSequenceStart">▶ Bắt đầu đọc tăng dần</button>
        <button type="button" class="btn btn-secondary" id="btnSequenceStop">Dừng</button>
      </div>
    </section>

    <!-- 4. Đọc ngẫu nhiên: rút số không lặp lại trong mỗi lượt -->
    <section id="controls-random" class="controls hidden">
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnRandStart">▶ Tự động đọc số</button>
        <button type="button" class="btn btn-secondary" id="btnRandStop">Dừng</button>
      </div>
      <button type="button" class="btn btn-secondary" id="btnRandNext">Số ngẫu nhiên mới</button>
    </section>

    <!-- 5. Kiểm tra -->
    <section id="controls-quiz" class="controls hidden">
      <button type="button" class="btn btn-primary" id="btnQuizStart">🔊 Phát số ngẫu nhiên</button>
      <div class="quiz-input-group">
        <input type="number" id="quizInput" placeholder="Nhập số nghe được…" step="1" inputmode="numeric">
        <button type="button" class="btn btn-primary" id="btnQuizSubmit">Gửi</button>
      </div>
      <div class="score">Đúng: <strong id="scoreCorrect">0</strong> &nbsp;|&nbsp; Sai: <strong id="scoreWrong">0</strong></div>

    <!-- 6. Đọc năm sinh -->
    <section id="controls-year" class="controls hidden">
      <div class="field-group">
        <label class="field-label" for="birthYear">Nhập năm sinh gồm 4 chữ số:</label>
        <input class="field-input" type="text" id="birthYear" value="1990" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="off">
      </div>
      <button type="button" class="btn btn-primary" id="btnSpeakYear">🔊 Nghe năm sinh</button>
    </section>

    <!-- 7. Đọc số điện thoại -->
    <section id="controls-phone" class="controls hidden">
      <div class="field-group">
        <label class="field-label" for="phoneNumber">Nhập số điện thoại:</label>
        <input class="field-input" type="tel" id="phoneNumber" value="0912345678" maxlength="20" inputmode="numeric" autocomplete="tel" placeholder="Nhập số điện thoại">
      </div>
      <button type="button" class="btn btn-primary" id="btnSpeakPhone">🔊 Nghe số điện thoại</button>
    </section>

    let currentMode = 'single';

    let timer = null;
    let currentNumber = null;
    let sequenceCurrent = 1;
    let score = { correct: 0, wrong: 0 };

    // Trạng thái riêng của chế độ 5: rút số không lặp trong một lượt kiểm tra.

    let quizAnswered = false;

    function loadChineseVoice() {
      if (!('speechSynthesis' in window)) {
        chineseVoice = null;
        setVoiceStatus('Trình duyệt này không hỗ trợ phát âm. Hãy mở bằng Safari hoặc Chrome mới nhất.', true);
        return null;
      }
      const voices = window.speechSynthesis.getVoices() || [];
      const chineseVoices = voices.filter(v => /^zh([_-]|$)/i.test(v.lang || ''));
      chineseVoice = chineseVoices.find(v => /^zh[-_]CN$/i.test(v.lang || ''))
        || chineseVoices.find(v => /^zh[-_]Hans([-_]CN)?$/i.test(v.lang || ''))
        || chineseVoices.find(v => /^zh[-_]TW$/i.test(v.lang || ''))
        || chineseVoices.find(v => /^zh([-_]|$)/i.test(v.lang || ''))
        || null;

      if (chineseVoice) {
        setVoiceStatus('Đã tìm thấy giọng tiếng Trung: ' + chineseVoice.name + '. Giọng nam hoặc nữ tùy thiết bị.');
      } else if (voices.length > 0) {
        setVoiceStatus('Thiết bị chưa có giọng đọc tiếng Trung. Hãy cài thêm giọng Chinese / 中文 trong cài đặt chuyển văn bản thành giọng nói.', true);
      } else {
        setVoiceStatus('Đang chờ Safari/Chrome tải danh sách giọng tiếng Trung. Chạm nút phát âm sau khi trang tải xong.', true);
      }
      return chineseVoice;
    }

    if ('speechSynthesis' in window) {
      loadChineseVoice();
      window.speechSynthesis.addEventListener?.('voiceschanged', loadChineseVoice);
      window.speechSynthesis.onvoiceschanged = loadChineseVoice;
      setTimeout(loadChineseVoice, 500);
      setTimeout(loadChineseVoice, 1500);
    }

    function sectionToChinese(section, omitLeadingOneForTen = true) {
      if (section === 0) return { zh: '', py: '' };
      const digits = String(section).padStart(4, '0').split('').map(Number);
      let zh = '';
      let py = '';
      let zeroPending = false;
      let started = false;

      for (let i = 0; i < 4; i++) {
        const digit = digits[i];
        const unitIndex = 3 - i;
        if (digit === 0) {
          if (started && digits.slice(i + 1).some(n => n !== 0)) zeroPending = true;
          continue;
        }
        if (zeroPending) {
          zh += '零';
          py += (py ? ' ' : '') + 'líng';
          zeroPending = false;
        }
        if (!(omitLeadingOneForTen && unitIndex === 1 && digit === 1 && !started)) {
          zh += zhDigits[digit];
          py += (py ? ' ' : '') + pyDigits[digit];
        }
        if (unitIndex > 0) {
          zh += sectionUnits[unitIndex];
          py += (py ? ' ' : '') + sectionPinyin[unitIndex];
        }
        started = true;
      }
      return { zh, py };
    }

    function numberToChinese(value) {
      const num = Math.trunc(Number(value));
      if (!Number.isFinite(num) || num < 0 || num > 999999) return { zh: String(value), pinyin: '' };
      if (num === 0) return { zh: '零', pinyin: 'líng' };

      const wan = Math.floor(num / 10000);
      const rest = num % 10000;
      const high = sectionToChinese(wan);
      const low = sectionToChinese(rest, wan === 0);
      let zh = '';
      let pinyin = '';

      if (wan > 0) {
        zh = high.zh + '万';
        pinyin = high.py + ' wàn';
        if (rest > 0) {
          if (rest < 1000) { zh += '零'; pinyin += ' líng'; }
          zh += low.zh;
          pinyin += ' ' + low.py;
        }
      } else {
        zh = low.zh;
        pinyin = low.py;
      }
      return { zh, pinyin };
    }

    function digitSequenceToChinese(digits, addYearWord = false, useYaoForOne = false) {
      // Chỉ chế độ số điện thoại bật useYaoForOne để đọc 1 thành 幺 (yāo).
      // Năm sinh mặc định vẫn đọc 1 là 一 (yī).
      const chars = digits.split('').map(d => {
        if (useYaoForOne && d === '1') return '幺';
        return zhDigits[Number(d)];
      });
      const pinyin = digits.split('').map(d => {
        if (useYaoForOne && d === '1') return 'yāo';
        return pyDigits[Number(d)];
      }).join(' ');
      return {
        zh: chars.join('') + (addYearWord ? '年' : ''),
        pinyin: pinyin + (addYearWord ? ' nián' : ''),
        spoken: chars.join('，') + (addYearWord ? '年' : '')
      };
    }

    function getRange() {
      let min = Number.parseInt($('minNum').value, 10);
      let max = Number.parseInt($('maxNum').value, 10);
      if (!Number.isFinite(min)) min = 1;
      if (!Number.isFinite(max)) max = 100;
      min = Math.max(0, Math.min(999999, min));
      max = Math.max(0, Math.min(999999, max));
      // Không phụ thuộc thứ tự nhập: 75–30 cũng được hiểu là 30–75.
      // Giữ nguyên giá trị hiển thị người dùng đã nhập; chỉ chuẩn hóa khi xử lý.
      if (min > max) [min, max] = [max, min];
      return { min, max };
    }

    function getDelay() {
      const raw = Number($('delaySec').value);
      // Mặc định 5 giây; cho phép người dùng tự chọn thời gian nghỉ.
      // Giới hạn kỹ thuật theo setTimeout của trình duyệt để tránh tràn số.
      const maxSeconds = 2147483.647;
      const sec = Number.isFinite(raw) ? Math.max(0.1, Math.min(maxSeconds, raw)) : 5;
      $('delaySec').value = String(sec);
      return Math.round(sec * 1000);
    }

    function setDisplay(original, zh, pinyin, hideAnswer = false) {
      $('feedbackText').textContent = '';
      $('feedbackText').className = 'feedback';
      $('displayNum').textContent = hideAnswer ? '???' : String(original);
      $('displayZh').textContent = hideAnswer ? '🔊 正在听…' : zh;
      $('displayPinyin').textContent = hideAnswer ? '' : pinyin;
    }

    function updateNumberDisplay(num, hideAnswer = false) {
      const data = numberToChinese(num);
      setDisplay(num, data.zh, data.pinyin, hideAnswer);
    }

    function cancelSpeechOnly() {
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (_) { /* Giữ giao diện ổn định. */ }
      }
    }

    function speakChineseText(textToSpeak, callback = null, token = runToken) {
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
        setVoiceStatus('Trình duyệt không hỗ trợ đọc văn bản. Hãy mở bằng Safari hoặc Chrome mới nhất.', true);
        if (callback) callback(false);
        return;
      }

      loadChineseVoice();
      if (!chineseVoice) {
        setVoiceStatus('Không phát âm để tránh đọc sai ngôn ngữ: thiết bị chưa cung cấp giọng tiếng Trung. Hãy cài giọng Chinese / 中文.', true);
        if (callback) callback(false);
        return;
      }

      cancelSpeechOnly();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'zh-CN';
      utterance.voice = chineseVoice;
      utterance.rate = 0.82;
      utterance.pitch = 1;
      let finished = false;
      let watchdog = null;

      const finish = (ok) => {
        if (finished) return;
        finished = true;
        if (watchdog) clearTimeout(watchdog);
        if (token === runToken && callback) callback(ok);
      };
      utterance.onend = () => finish(true);
      utterance.onerror = (event) => {
        if (token === runToken && event && event.error !== 'canceled' && event.error !== 'interrupted') {
          setVoiceStatus('Không phát được âm thanh. Hãy kiểm tra âm lượng và giọng Chinese / 中文 của thiết bị.', true);
        }
        finish(false);
      };

      watchdog = setTimeout(() => finish(true), Math.max(5000, textToSpeak.length * 900));
      try {
        window.speechSynthesis.speak(utterance);
      } catch (error) {
        finish(false);
        setVoiceStatus('Trình duyệt không thể khởi động giọng đọc tiếng Trung. Hãy mở trực tiếp bằng Safari/Chrome.', true);
      }
    }

    function stopAll() {
      isRunning = false;
      runToken++;
      if (timer) clearTimeout(timer);
      timer = null;
      if (quizAdvanceTimer) clearTimeout(quizAdvanceTimer);
      quizAdvanceTimer = null;
      cancelSpeechOnly();
      $('btnSequenceStart').textContent = currentMode === 'desc' ? '▶ Bắt đầu đọc giảm dần' : '▶ Bắt đầu đọc tăng dần';
      $('btnRandStart').textContent = '▶ Tự động đọc số';
    }

    function switchMode(mode) {
      stopAll();
      currentMode = mode;
      allModes.forEach(item => $('mode-' + item).classList.toggle('active', item === mode));
      $('rangeSettings').classList.toggle('hidden', !['asc','desc','random','quiz'].includes(mode));
      $('delaySettings').classList.toggle('hidden', !['asc','desc','random','quiz'].includes(mode));
      $('controls-single').classList.toggle('hidden', mode !== 'single');
      $('controls-sequence').classList.toggle('hidden', !['asc','desc'].includes(mode));
      $('controls-random').classList.toggle('hidden', mode !== 'random');
      $('controls-quiz').classList.toggle('hidden', mode !== 'quiz');
      $('controls-year').classList.toggle('hidden', mode !== 'year');
      $('controls-phone').classList.toggle('hidden', mode !== 'phone');
      $('btnSequenceStart').textContent = mode === 'desc' ? '▶ Bắt đầu đọc giảm dần' : '▶ Bắt đầu đọc tăng dần';
      $('displayNum').textContent = '--';
      $('displayZh').textContent = '';
      $('displayPinyin').textContent = '';
      $('feedbackText').textContent = '';
      currentNumber = null;
    }

    function speakSingleNumber() {
      stopAll();
      const raw = $('singleNum').value.trim();
      const num = Number(raw);
      if (raw === '' || !Number.isInteger(num) || num < 0 || num > 999999) {
        $('feedbackText').textContent = 'Vui lòng nhập số nguyên từ 0 đến 999.999.';
        $('feedbackText').className = 'feedback wrong';
        return;
      }
      const data = numberToChinese(num);
      setDisplay(num, data.zh, data.pinyin);
      speakChineseText(data.zh, null, runToken);
    }

    function startSequence() {
      if (isRunning) { stopAll(); return; }
      const { min, max } = getRange();
      const descending = currentMode === 'desc';
      sequenceCurrent = descending ? max : min;
      isRunning = true;
      const token = ++runToken;
      $('btnSequenceStart').textContent = 'Tạm dừng';

      const step = () => {
        if (!isRunning || token !== runToken) return;
        const inRange = descending ? sequenceCurrent >= min : sequenceCurrent <= max;
        if (!inRange) { stopAll(); return; }
        const number = sequenceCurrent;
        updateNumberDisplay(number);
        speakChineseText(numberToChinese(number).zh, (ok) => {
          if (!isRunning || token !== runToken) return;
          if (!ok) { stopAll(); return; }
          sequenceCurrent += descending ? -1 : 1;
          const hasNext = descending ? sequenceCurrent >= min : sequenceCurrent <= max;
          if (hasNext) timer = setTimeout(step, getDelay());
          else stopAll();
        }, token);
      };
      step();
    }

    // Bộ rút số không hoàn lại dành riêng cho chế độ 4 (lô tô).
    // Dùng Fisher–Yates dạng lười để không phải tạo mảng rất lớn trên điện thoại.
    let randomDeckInitialized = false;
    let randomDeckMin = null;
    let randomDeckMax = null;
    let randomRemaining = 0;
    let randomAvailableCount = 0;
    let randomSwapMap = new Map();
    // Theo dõi những số đã xuất hiện trong lượt hiện tại. Dùng 1 byte cho
    // mỗi số từ 0 đến 999.999 để không bị lặp kể cả khi người dùng đổi phạm vi
    // giữa chừng; bộ nhớ chỉ khoảng 1 MB trên điện thoại.
    let randomDrawnFlags = null;

    function resetRandomDeck(clearHistory = false) {
      const { min, max } = getRange();
      randomDeckMin = min;
      randomDeckMax = max;
      randomRemaining = max - min + 1;
      randomSwapMap = new Map();
      if (clearHistory || !randomDrawnFlags) randomDrawnFlags = new Uint8Array(1000000);
      randomAvailableCount = 0;
      for (let number = min; number <= max; number++) {
        if (!randomDrawnFlags[number]) randomAvailableCount++;
      }
      randomDeckInitialized = true;
    }

    function ensureRandomDeck() {
      const { min, max } = getRange();
      if (!randomDeckInitialized) {
        resetRandomDeck(true);
      } else if (min !== randomDeckMin || max !== randomDeckMax) {
        // Đổi phạm vi sẽ tạo danh sách ứng viên mới, nhưng vẫn giữ dấu các
        // số đã đọc để không có số nào lặp lại trong cùng lượt chơi.
        resetRandomDeck(false);
      }
    }

    function drawUniqueRandomNumber() {
      ensureRandomDeck();
      // Mỗi ứng viên trong phạm vi hiện tại chỉ được rút khỏi bộ một lần.
      // Nếu đã xuất hiện ở phạm vi trước đó của cùng lượt, bỏ qua ứng viên đó.
      while (randomRemaining > 0) {
        const pickedIndex = Math.floor(Math.random() * randomRemaining);
        const lastIndex = randomRemaining - 1;
        const pickedValue = randomSwapMap.has(pickedIndex)
          ? randomSwapMap.get(pickedIndex) : pickedIndex;
        const lastValue = randomSwapMap.has(lastIndex)
          ? randomSwapMap.get(lastIndex) : lastIndex;

        if (pickedIndex !== lastIndex) randomSwapMap.set(pickedIndex, lastValue);
        randomSwapMap.delete(lastIndex);
        randomRemaining--;

        const number = randomDeckMin + pickedValue;
        if (randomDrawnFlags[number]) continue;
        randomDrawnFlags[number] = 1;
        randomAvailableCount--;
        return number;
      }
      return null;
    }

    function showRandomFinished() {
      $('feedbackText').textContent = 'Đã đọc hết các số trong phạm vi.';
      $('feedbackText').className = 'feedback correct';
    }

    function showRandomNumber(hideAnswer, auto = false, token = runToken) {
      const nextNumber = drawUniqueRandomNumber();
      if (nextNumber === null) {
        stopAll();
        showRandomFinished();
        return;
      }

      currentNumber = nextNumber;
      updateNumberDisplay(currentNumber, hideAnswer);
      speakChineseText(numberToChinese(currentNumber).zh, (ok) => {
        if (token !== runToken) return;
        if (auto && isRunning) {
          if (!ok) { stopAll(); return; }
          updateNumberDisplay(currentNumber, false);
        }

        // Khi đã đọc hết ứng viên (kể cả các số đã được đánh dấu từ một
        // phạm vi trước trong cùng lượt), dừng hẳn và không tự quay vòng.
        if (randomAvailableCount === 0) {
          if (auto && isRunning) stopAll();
          showRandomFinished();
          return;
        }

        if (auto && isRunning) {
          timer = setTimeout(() => {
            if (isRunning && token === runToken) showRandomNumber(true, true, token);
          }, getDelay());
        }
      }, token);
    }

    function startRandom() {
      if (isRunning) { stopAll(); return; }
      ensureRandomDeck();
      // Không tự chạy vòng mới khi hết số. Chỉ khi người dùng chủ động bấm
      // Start lần nữa sau khi đã kết thúc thì mới tạo một lượt mới.
      if (randomAvailableCount <= 0) {
        // Một lượt mới chỉ bắt đầu khi người dùng chủ động nhấn Start.
        resetRandomDeck(true);
      }
      isRunning = true;
      const token = ++runToken;
      $('btnRandStart').textContent = 'Tạm dừng';
      showRandomNumber(true, true, token);
    }

    function nextRandomManual() {
      stopAll();
      ensureRandomDeck();
      showRandomNumber(false, false, runToken);
    }

    // Bộ rút số không hoàn lại riêng cho chế độ 5.
    // Dùng Fisher–Yates dạng lười để không cần tạo mảng tối đa 1.000.000 phần tử.
    function resetQuizDeck(clearHistory = false) {
      const { min, max } = getRange();
      quizDeckMin = min;
      quizDeckMax = max;
      quizDeckRemaining = max - min + 1;
      quizSwapMap = new Map();
      if (clearHistory) quizDrawnFlags = new Uint8Array(1000000);
      quizAvailableCount = 0;
      for (let number = min; number <= max; number++) {
        if (!quizDrawnFlags[number]) quizAvailableCount++;
      }
      quizSessionInitialized = true;
    }

    function ensureQuizDeck() {
      const { min, max } = getRange();
      if (!quizSessionInitialized) {
        resetQuizDeck(true);
      } else if (min !== quizDeckMin || max !== quizDeckMax) {
        // Khi đổi phạm vi, số đã hỏi trong lượt này vẫn được ghi nhớ.
        resetQuizDeck(false);
      }
    }

    function drawUniqueQuizNumber() {
      ensureQuizDeck();
      if (quizAvailableCount <= 0) return null;

      while (quizDeckRemaining > 0) {
        const pickedIndex = Math.floor(Math.random() * quizDeckRemaining);
        const lastIndex = quizDeckRemaining - 1;
        const pickedValue = quizSwapMap.has(pickedIndex)
          ? quizSwapMap.get(pickedIndex) : pickedIndex;
        const lastValue = quizSwapMap.has(lastIndex)
          ? quizSwapMap.get(lastIndex) : lastIndex;

        if (pickedIndex !== lastIndex) quizSwapMap.set(pickedIndex, lastValue);
        quizSwapMap.delete(lastIndex);
        quizDeckRemaining--;

        const number = quizDeckMin + pickedValue;
        if (quizDrawnFlags[number]) continue;
        quizDrawnFlags[number] = 1;
        quizAvailableCount--;
        return number;
      }
      return null;
    }

    function showQuizFinished() {
      quizCurrentNumber = null;
      quizAnswered = false;
      $('btnQuizStart').textContent = '▶ Bắt đầu lượt mới';
      $('feedbackText').textContent = 'Đã kiểm tra hết các số trong phạm vi.';
      $('feedbackText').className = 'feedback correct';
    }

    function issueQuizQuestion() {
      const nextNumber = drawUniqueQuizNumber();
      if (nextNumber === null) {
        showQuizFinished();
        return;
      }

      quizCurrentNumber = nextNumber;
      quizAnswered = false;
      currentNumber = nextNumber;
      $('btnQuizStart').textContent = '🔊 Phát lại số hiện tại';
      $('quizInput').value = '';
      updateNumberDisplay(nextNumber, true);
      const token = ++runToken;
      speakChineseText(numberToChinese(nextNumber).zh, null, token);
    }

    function startQuizNext() {
      // Nếu câu hiện tại chưa trả lời, nút chỉ phát lại câu đó, không rút số mới.
      if (quizCurrentNumber !== null && !quizAnswered) {
        const token = ++runToken;
        speakChineseText(numberToChinese(quizCurrentNumber).zh, null, token);
        return;
      }

      // Nếu người dùng đã trả lời và đang chờ tự chuyển câu, không cho bấm
      // để bỏ qua thời gian nghỉ hoặc tạo thêm câu hỏi.
      if (quizCurrentNumber !== null && quizAnswered && quizAdvanceTimer) return;

      // Chỉ bắt đầu lượt mới khi người dùng chủ động bấm nút sau khi đã hết số.
      if (quizSessionInitialized && quizAvailableCount <= 0) {
        resetQuizDeck(true);
      } else {
        ensureQuizDeck();
      }
      issueQuizQuestion();
    }

    function advanceQuizAfterDelay() {
      quizAdvanceTimer = null;
      if (currentMode !== 'quiz') return;
      if (!quizAnswered) return;
      // Nếu người dùng đổi phạm vi trong lúc chờ, cập nhật tập số còn lại
      // nhưng vẫn loại trừ mọi số đã được hỏi trong lượt hiện tại.
      ensureQuizDeck();

      if (quizAvailableCount <= 0) {
        showQuizFinished();
        return;
      }
      issueQuizQuestion();
    }

    function checkQuizAnswer() {
      if (quizCurrentNumber === null || quizAnswered) return;
      const raw = $('quizInput').value.trim();
      if (raw === '') {
        $('feedbackText').textContent = 'Vui lòng nhập số bạn nghe được.';
        $('feedbackText').className = 'feedback wrong';
        return;
      }

      const val = Number(raw);
      const answer = quizCurrentNumber;
      quizAnswered = true;
      currentNumber = null;
      updateNumberDisplay(answer, false);
      if (Number.isInteger(val) && val === answer) {
        $('feedbackText').textContent = '✓ Chính xác!';
        $('feedbackText').className = 'feedback correct';
        score.correct++;
      } else {
        $('feedbackText').textContent = '✗ Sai rồi! Đáp án đúng: ' + answer;
        $('feedbackText').className = 'feedback wrong';
        score.wrong++;
      }
      $('scoreCorrect').textContent = score.correct;
      $('scoreWrong').textContent = score.wrong;

      // Sau khi chấm điểm, chờ đúng khoảng giây người dùng cài rồi mới hỏi số mới.
      // Câu cuối cùng cũng chờ đủ thời gian để người dùng xem kết quả, sau đó dừng.
      if (quizAdvanceTimer) clearTimeout(quizAdvanceTimer);
      quizAdvanceTimer = setTimeout(advanceQuizAfterDelay, getDelay());
    }

    function speakBirthYear() {
      stopAll();
      const year = $('birthYear').value.trim();
      if (!/^\d{4}$/.test(year)) {
        $('feedbackText').textContent = 'Vui lòng nhập năm sinh gồm đúng 4 chữ số.';
        $('feedbackText').className = 'feedback wrong';
        return;
      }
      const data = digitSequenceToChinese(year, true);
      setDisplay(year, data.zh, data.pinyin);
      speakChineseText(data.spoken, null, runToken);
    }

    function speakPhoneNumber() {
      stopAll();
      const phone = $('phoneNumber').value.replace(/\D/g, '');
      $('phoneNumber').value = phone;
      if (!/^\d{3,20}$/.test(phone)) {
        $('feedbackText').textContent = 'Vui lòng nhập số điện thoại gồm 3–20 chữ số.';
        $('feedbackText').className = 'feedback wrong';
        return;
      }
      const data = digitSequenceToChinese(phone, false, true);
      setDisplay(phone, data.zh, data.pinyin);
      speakChineseText(data.spoken, null, runToken);
    }

    // Đổi chế độ bằng cách chạm vào một trong bảy mục.
    allModes.forEach(mode => $('mode-' + mode).addEventListener('click', () => switchMode(mode)));
    $('btnSpeakSingle').addEventListener('click', speakSingleNumber);
    $('singleNum').addEventListener('keydown', event => { if (event.key === 'Enter') speakSingleNumber(); });
    $('btnSequenceStart').addEventListener('click', startSequence);
    $('btnSequenceStop').addEventListener('click', stopAll);
    $('btnRandStart').addEventListener('click', startRandom);
    $('btnRandStop').addEventListener('click', stopAll);
    $('btnRandNext').addEventListener('click', nextRandomManual);
    $('btnQuizStart').addEventListener('click', startQuizNext);
    $('btnQuizSubmit').addEventListener('click', checkQuizAnswer);
    $('quizInput').addEventListener('keydown', event => { if (event.key === 'Enter') checkQuizAnswer(); });
    $('btnSpeakYear').addEventListener('click', speakBirthYear);
    $('birthYear').addEventListener('keydown', event => { if (event.key === 'Enter') speakBirthYear(); });
    $('birthYear').addEventListener('input', () => { $('birthYear').value = $('birthYear').value.replace(/\D/g, '').slice(0, 4); });
    $('btnSpeakPhone').addEventListener('click', speakPhoneNumber);
    $('phoneNumber').addEventListener('input', () => { $('phoneNumber').value = $('phoneNumber').value.replace(/\D/g, '').slice(0, 20); });
    $('phoneNumber').addEventListener('keydown', event => { if (event.key === 'Enter') speakPhoneNumber(); });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isRunning) stopAll();
    });

    // Chế độ mặc định: đọc một số do người học nhập.
    switchMode('single');
  })();
  </script>
</body>
</html>
